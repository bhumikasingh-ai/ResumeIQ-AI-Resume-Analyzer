<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeIQ - AI Resume Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 40px 25px;
      border-radius: 0 0 25px 25px;
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 15px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: vertical;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    #result {
      display: none;
    }

    .score {
      text-align: center;
      font-size: 55px;
      font-weight: bold;
      color: #4f46e5;
      margin: 15px 0;
    }

    .result-box {
      padding: 15px;
      background: #f8f9ff;
      border-radius: 12px;
      margin-top: 12px;
    }

    .result-box h3 {
      margin-bottom: 8px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 7px 0;
    }

    footer {
      text-align: center;
      margin: 25px 0;
      color: #666;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      header h1 {
        font-size: 30px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🤖 ResumeIQ</h1>
      <p>AI-Powered Resume Analyzer & ATS Score Checker</p>
    </header>

    <div class="card">

      <h2>📄 Analyze Your Resume</h2>

      <label for="resume">Paste Your Resume</label>
      <textarea id="resume"
        placeholder="Paste your resume text here..."></textarea>

      <label for="job">Paste Job Description</label>
      <textarea id="job"
        placeholder="Paste the job description here..."></textarea>

      <button onclick="analyzeResume()">
        🔍 Analyze Resume
      </button>

    </div>

    <div class="card" id="result">

      <h2>📊 Analysis Result</h2>

      <div class="score" id="score">0%</div>

      <div class="result-box">
        <h3>🔑 Keyword Match</h3>
        <p id="keywords"></p>
      </div>

      <div class="result-box">
        <h3>✅ Strengths</h3>
        <ul id="strengths"></
